name: Security & Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run lint
          npm run build

      - name: Run unit and rules tests
        run: |
          npx eslint firestore.rules
          npx tsx --test src/lib/documentLogic.test.ts src/lib/requestSchemas.test.ts src/lib/freeAiProviders.test.ts src/lib/textScramble.test.ts src/lib/textHighlight.test.ts src/lib/docCompressor.test.ts src/lib/preloaderLogic.test.ts src/lib/firebaseConfig.test.ts firestore.rules.test.ts

      - name: Dependency vulnerability audit
        run: |
          npm audit --omit=dev --audit-level=high
          node -e '
            const { execSync } = require("child_process");
            let raw = "";
            try {
              raw = execSync("npm audit --json", { encoding: "utf8" });
            } catch (err) {
              raw = err.stdout ? String(err.stdout) : "";
            }
            const report = JSON.parse(raw || "{}");
            const allowedUnpatchedDevAdvisories = new Set(["GHSA-fc5q-39xc-vjpf"]);
            const blockers = [];
            for (const [pkg, info] of Object.entries(report.vulnerabilities || {})) {
              for (const item of info.via || []) {
                if (typeof item === "string") continue;
                if (item.severity !== "high" && item.severity !== "critical") continue;
                const ghsaId = String(item.url || "").split("/").pop();
                const isAllowed =
                  item.severity === "high" &&
                  info.fixAvailable === false &&
                  allowedUnpatchedDevAdvisories.has(ghsaId);
                if (!isAllowed) {
                  blockers.push(`${pkg}:${item.severity}:${ghsaId || item.title}`);
                }
              }
            }
            if (blockers.length > 0) {
              console.error("Unresolved high/critical vulnerabilities:", blockers.join(", "));
              process.exit(1);
            }
            console.log("Audit passed: 0 runtime vulnerabilities; no unapproved dev advisories.");
          '

      - name: Secret and sensitive-file scan
        run: |
          set -euo pipefail
          tracked=$(git ls-files)
          for f in $tracked; do
            case "$f" in
              .env|.env.*|firebase-applet-config.json|firebase_applet_config.xml|*.pem|*.key|*.p12)
                case "$f" in
                  .env.example|firebase-applet-config.example.json) ;;
                  *)
                    echo "::error::Sensitive file tracked in repository: $f"
                    exit 1
                    ;;
                esac
                ;;
            esac
          done
          if git grep -nE '(AIza[0-9A-Za-z_-]{35}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----)' -- . ':!node_modules' ':!dist'; then
            echo "::error::Potential secret detected in repository files."
            exit 1
          fi
