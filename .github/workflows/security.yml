name: Security & Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run lint
          npm run build

      - name: Run unit and rules tests
        run: |
          npx eslint firestore.rules
          npx tsx --test src/lib/documentLogic.test.ts src/lib/requestSchemas.test.ts src/lib/freeAiProviders.test.ts firestore.rules.test.ts

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Secret and sensitive-file scan
        run: |
          set -euo pipefail
          tracked=$(git ls-files)
          for f in $tracked; do
            case "$f" in
              .env|.env.*|firebase-applet-config.json|firebase_applet_config.xml|*.pem|*.key|*.p12)
                case "$f" in
                  .env.example|firebase-applet-config.example.json) ;;
                  *)
                    echo "::error::Sensitive file tracked in repository: $f"
                    exit 1
                    ;;
                esac
                ;;
            esac
          done
          if git grep -nE '(AIza[0-9A-Za-z_-]{35}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----)' -- . ':!node_modules' ':!dist'; then
            echo "::error::Potential secret detected in repository files."
            exit 1
          fi
